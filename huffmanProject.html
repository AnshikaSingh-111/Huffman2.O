<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman Compression Wizard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --primary-dark: #5649c0;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --error: #ff7675;
            --success: #00b894;
            --warning: #fdcb6e;
            --background: #f7f7ff;
            --surface: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --border: #dfe6e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            border-radius: 50%;
            opacity: 0.5;
            animation: float linear infinite;
            filter: blur(5px);
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
            }
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: var(--surface);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        h1 {
            color: var(--primary);
            margin-bottom: 25px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        input[type="file"] {
            display: none;
        }

        .file-input {
            border: 3px dashed var(--border);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .file-input:hover {
            border-color: var(--primary);
            background-color: rgba(108, 92, 231, 0.05);
            transform: translateY(-3px);
        }

        .file-input i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
        }

        .file-input .text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .file-input .subtext {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .file-info {
            background-color: var(--background);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-info.active {
            display: block;
        }

        .file-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .file-info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .file-info-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .file-info-value {
            font-weight: 600;
            color: var(--primary-dark);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0));
            opacity: 0;
            transition: opacity 0.3s;
        }

        button:hover::after {
            opacity: 1;
        }

        .progress-container {
            width: 100%;
            background-color: var(--border);
            border-radius: 10px;
            height: 10px;
            margin: 25px 0;
            overflow: hidden;
            display: none;
        }

        .progress-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.1) 25%,
                rgba(255, 255, 255, 0.5) 50%,
                rgba(255, 255, 255, 0.1) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            display: none;
        }

        .progress-text.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .status-message i {
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .status-message.success {
            background-color: rgba(0, 184, 148, 0.1);
            color: var(--success);
            display: flex;
        }

        .status-message.error {
            background-color: rgba(255, 118, 117, 0.1);
            color: var(--error);
            display: flex;
        }

        .status-message.warning {
            background-color: rgba(253, 203, 110, 0.1);
            color: var(--warning);
            display: flex;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            position: relative;
        }

        .result-title i {
            margin-right: 10px;
            color: var(--success);
        }

        .result-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-item {
            background-color: var(--background);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .result-item:hover {
            transform: translateY(-5px);
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .bit-preview {
            margin-top: 30px;
            background-color: var(--background);
            border-radius: 15px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .bit-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
        }

        .bit-preview-title {
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .bit-preview-title i {
            margin-right: 10px;
        }

        .bit-preview-content {
            padding: 20px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            background-color: var(--surface);
            color: var(--primary-dark);
            font-weight: 500;
        }

        .download-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
        }

        .download-btn:hover {
            box-shadow: 0 8px 25px rgba(0, 206, 201, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .file-input {
                padding: 20px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="bubbles" id="bubbles"></div>
    
    <div class="container">
        <h1>Huffman Compression Wizard</h1>
        
        <div class="input-group">
            <label for="inputFile">Select a file to compress:</label>
            <label class="file-input" id="fileInputLabel">
                <i class="material-icons">cloud_upload</i>
                <div class="text">Drag & drop your file here</div>
                <div class="subtext">or click to browse files</div>
                <input type="file" id="inputFile">
            </label>
            <div class="file-info" id="fileInfo">
                <div class="file-info-row">
                    <span class="file-info-label">File Name:</span>
                    <span class="file-info-value" id="fileName">-</span>
                </div>
                <div class="file-info-row">
                    <span class="file-info-label">File Size:</span>
                    <span class="file-info-value" id="fileSize">-</span>
                </div>
                <div class="file-info-row">
                    <span class="file-info-label">File Type:</span>
                    <span class="file-info-value" id="fileType">-</span>
                </div>
            </div>
        </div>
        
        <button id="compressBtn" disabled>
            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">compress</i>
            Compress File
        </button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="progress-text" id="progressText">Processing: 0%</div>
        
        <div class="status-message" id="statusMessage"></div>
        
        <div class="results" id="results">
            <div class="result-title">
                <i class="material-icons">done_all</i> Compression Results
            </div>
            
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-label">Original Size</div>
                    <div class="result-value" id="originalSize">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Compressed Size</div>
                    <div class="result-value" id="compressedSize">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Compression Ratio</div>
                    <div class="result-value" id="compressionRatio">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Bits per Character</div>
                    <div class="result-value" id="bitsPerChar">-</div>
                </div>
            </div>
            
            <div class="bit-preview">
                <div class="bit-preview-header">
                    <div class="bit-preview-title">
                        <i class="material-icons">code</i>
                        Compressed Bit Pattern (first 500 bits)
                    </div>
                </div>
                <div class="bit-preview-content" id="bitPattern"></div>
            </div>
            
            <button id="downloadBtn" class="download-btn">
                <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">download</i>
                Download Compressed File
            </button>
        </div>
    </div>

    <script>
        class Node {
            constructor(ch, freq) {
                this.ch = ch;
                this.freq = freq;
                this.left = null;
                this.right = null;
            }
        }

        // Create floating bubbles
        function createBubbles() {
            const bubblesContainer = document.getElementById('bubbles');
            const bubbleCount = 15;
            
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // Random size between 50px and 150px
                const size = Math.random() * 100 + 50;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                
                // Random position
                bubble.style.left = `${Math.random() * 100}%`;
                
                // Random animation duration between 10s and 30s
                const duration = Math.random() * 20 + 10;
                bubble.style.animationDuration = `${duration}s`;
                
                // Random delay
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                
                bubblesContainer.appendChild(bubble);
            }
        }

        // Initialize bubbles
        createBubbles();

        // DOM elements
        const inputFile = document.getElementById('inputFile');
        const fileInputLabel = document.getElementById('fileInputLabel');
        const fileInfo = document.getElementById('fileInfo');
        const compressBtn = document.getElementById('compressBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');
        const results = document.getElementById('results');
        const downloadBtn = document.getElementById('downloadBtn');

        // Global variables
        let originalFile = null;
        let compressedBitString = null;

        // Event listeners
        inputFile.addEventListener('change', handleFileSelect);
        fileInputLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileInputLabel.style.borderColor = 'var(--primary)';
            fileInputLabel.style.backgroundColor = 'rgba(108, 92, 231, 0.1)';
        });
        fileInputLabel.addEventListener('dragleave', () => {
            fileInputLabel.style.borderColor = 'var(--border)';
            fileInputLabel.style.backgroundColor = '';
        });
        fileInputLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileInputLabel.style.borderColor = 'var(--border)';
            fileInputLabel.style.backgroundColor = '';
            if (e.dataTransfer.files.length) {
                inputFile.files = e.dataTransfer.files;
                handleFileSelect({ target: inputFile });
            }
        });
        compressBtn.addEventListener('click', compressFile);
        downloadBtn.addEventListener('click', downloadCompressedFile);

        // File handling
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            
            // Update file info
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileType').textContent = file.type || 'Unknown';
            fileInfo.classList.add('active');
            
            // Enable compress button
            compressBtn.disabled = false;
            
            // Reset results
            results.classList.remove('active');
            statusMessage.className = 'status-message';
        }

        // Compression functions
        async function compressFile() {
            if (!originalFile) return;

            try {
                showProgress();
                
                // Read file content
                const content = await readFileAsText(originalFile);
                
                // Build frequency map
                const freq = buildFreqMap(content);
                
                // Build Huffman tree
                const root = buildTree(freq);
                
                // Generate codes
                const codes = {};
                generateCodes(root, '', codes);
                
                // Compress the content to a bit string (0s and 1s)
                compressedBitString = compressToBitString(content, codes);
                
                // Display the first 500 bits of the compressed data
                const displayBits = compressedBitString.length > 500 
                    ? compressedBitString.substring(0, 500) + "..." 
                    : compressedBitString;
                document.getElementById('bitPattern').textContent = displayBits;
                
                // Update results
                updateResults(content.length, compressedBitString.length);
                
                // Show success
                showStatus('success', 'Compression completed successfully!');
                results.classList.add('active');
                
            } catch (error) {
                showStatus('error', `Error during compression: ${error.message}`);
                console.error('Compression error:', error);
            } finally {
                hideProgress();
            }
        }

        function updateResults(originalSize, compressedBitLength) {
            const compressedSizeBytes = Math.ceil(compressedBitLength / 8);
            const ratio = ((compressedSizeBytes / originalSize) * 100).toFixed(2);
            const bitsPerChar = (compressedBitLength / originalSize).toFixed(2);
            
            document.getElementById('originalSize').textContent = formatFileSize(originalSize);
            document.getElementById('compressedSize').textContent = `${formatFileSize(compressedSizeBytes)} (${compressedBitLength} bits)`;
            document.getElementById('compressionRatio').textContent = `${ratio}%`;
            document.getElementById('bitsPerChar').textContent = `${bitsPerChar} bits/char`;
        }

        // Huffman algorithm functions
        function buildFreqMap(content) {
            const freq = {};
            for (let i = 0; i < content.length; i++) {
                const ch = content[i];
                freq[ch] = (freq[ch] || 0) + 1;
            }
            return freq;
        }

        function buildTree(freq) {
            const nodes = [];
            
            // Create leaf nodes for each character
            for (const ch in freq) {
                nodes.push(new Node(ch, freq[ch]));
            }
            
            // Build the tree
            while (nodes.length > 1) {
                // Sort nodes by frequency (ascending)
                nodes.sort((a, b) => a.freq - b.freq);
                
                // Take two nodes with lowest frequency
                const left = nodes.shift();
                const right = nodes.shift();
                
                // Create new internal node
                const parent = new Node(null, left.freq + right.freq);
                parent.left = left;
                parent.right = right;
                
                // Add to nodes array
                nodes.push(parent);
            }
            
            return nodes[0];
        }

        function generateCodes(node, code, codes) {
            if (!node) return;
            
            if (node.ch !== null) {
                codes[node.ch] = code;
                return;
            }
            
            generateCodes(node.left, code + '0', codes);
            generateCodes(node.right, code + '1', codes);
        }

        function compressToBitString(content, codes) {
            let compressed = '';
            for (let i = 0; i < content.length; i++) {
                compressed += codes[content[i]];
            }
            return compressed;
        }

        // Helper functions
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsText(file);
            });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return `${bytes} bytes`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }

        function showProgress() {
            progressContainer.classList.add('active');
            progressText.classList.add('active');
            compressBtn.disabled = true;
            
            // Simulate progress (in a real app, you'd update this based on actual progress)
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                if (progress > 100) {
                    clearInterval(interval);
                    return;
                }
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `Processing: ${progress}%`;
            }, 100);
        }

        function hideProgress() {
            progressContainer.classList.remove('active');
            progressText.classList.remove('active');
            progressBar.style.width = '0%';
            compressBtn.disabled = false;
        }

        function showStatus(type, message) {
            statusMessage.className = `status-message ${type}`;
            statusMessage.innerHTML = `<i class="material-icons">${type === 'success' ? 'check_circle' : 'error'}</i> ${message}`;
        }

        function downloadCompressedFile() {
            if (!compressedBitString) {
                showStatus('error', 'No compressed data available');
                return;
            }
            
            // Convert bit string to bytes
            const { byteArray, padding } = bitStringToBytes(compressedBitString);
            
            // Create blob and download
            const blob = new Blob([byteArray], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = originalFile ? `${originalFile.name}.huff` : 'compressed.huff';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function bitStringToBytes(bitString) {
            // Calculate padding needed to make length multiple of 8
            const padding = (8 - (bitString.length % 8)) % 8;
            
            // Pad with zeros
            const padded = bitString + '0'.repeat(padding);
            
            const byteArray = new Uint8Array(Math.ceil(padded.length / 8));
            
            for (let i = 0; i < byteArray.length; i++) {
                const byteStr = padded.substr(i * 8, 8);
                byteArray[i] = parseInt(byteStr, 2);
            }
            
            return { byteArray, padding };
        }
    </script>
</body>
</html>
